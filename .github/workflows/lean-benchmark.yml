name: Lean dependency benchmark
on:
  push:
    branches: [codex/lean-toolchain-ext4]
permissions:
  contents: read
jobs:
  replay:
    name: Rebuild the proof (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [seeded]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STAGE: 'false'
    steps:
      - name: Prepare benchmark volume
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/bench
          sudo chown "$USER" /mnt/bench
          df -h . /mnt/bench
          stat -f -c 'workspace filesystem: %T' "$GITHUB_WORKSPACE"
      - name: Provision the runner's trusted dependency seed
        if: matrix.mode == 'seeded'
        env:
          HOME: /mnt/bench/provision-home
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          mkdir -p "$HOME" /mnt/bench/seed
          git -C /mnt/bench/seed init -q
          git -C /mnt/bench/seed fetch -q --depth=1 https://github.com/leanprover-community/riemann-hypothesis c5451bd3ba92480e05c4218f5221bb2900c58706
          git -C /mnt/bench/seed checkout -q --detach FETCH_HEAD
          cd /mnt/bench/seed
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe mathlib/cache get
          python3 scripts/tauceti-cache-get.py
          cd /mnt/bench
          mv /mnt/bench/provision-home/.elan /mnt/bench/seed/.elan
          rm -rf /mnt/bench/provision-home
          sudo mount --bind /mnt/bench/seed /mnt/bench/seed
          sudo mount -o remount,bind,ro /mnt/bench/seed
          df -h .
      - name: Isolate the benchmark homes
        run: echo 'HOME=/mnt/bench/validation-home' >> "$GITHUB_ENV"
      - name: Start with a fresh home and checkout
        run: |
          test "$HOME" = /mnt/bench/validation-home
          rm -rf -- /mnt/bench/validation-home
          mkdir -p "$HOME"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - name: Checkout source PR 8607, sample 1
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.mode == 'cold' && '00ad5769997d4ac20c063018f913038e18ca943d' || '040cb61c60a306e323bc38d82da0f20eed08875a' }}
      - name: Fetch main's history for the cache baseline
        # On a pull request the checkout is GitHub's merge of the head into main. The baseline is
        # looked up along main's first-parent history (at most 200 commits).
        run: git fetch --no-tags --depth=200 origin +refs/heads/main:refs/remotes/origin/main

      - name: Restore prehydrated Lean packages
        if: matrix.mode == 'seeded'
        uses: gigaverse-app/ci-esta/actions/restore-lean-packages@b5faf1e34e6182ba177aacdb52db121067ba4bf0
        id: seed1
        with:
          seed-directory: /mnt/bench/seed
          link-elan-toolchains: 'true'
      - name: Install elan and the toolchain in lean-toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
          realpath "$("$HOME/.elan/bin/elan" which lean)" | grep '^/mnt/bench/seed/.elan/toolchains/'

      - name: Test the cache baseline selection
        run: python3 -I scripts/tests/test_ci_cache_baseline.py

      - name: Restore Mathlib's cache
        if: steps.seed1.outputs.cache-hit != 'true'
        # As in scripts/lake-cache-get.sh, which `lake exe cache get` runs.
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe mathlib/cache get

      - name: Restore Tau Ceti's cache
        # As in scripts/lake-cache-get.sh: checks the Mathlib pins agree and that the statements
        # import no Tau Ceti module, then fetches the oleans of the imported Tau Ceti modules.
        run: python3 scripts/tauceti-cache-get.py

      - name: Restore this project's cache
        # Exit 0: the exact build inputs were restored, and nothing should compile.
        # Exit 4: a baseline was restored, and lake build compiles what changed since.
        # Exit 3: no record at all, and lake build compiles everything.
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          status=0
          python3 scripts/ci-cache-get.py --baseline origin/main || status=$?
          case "$status" in
            0) echo "::notice::Restored the cache for these exact build inputs." ;;
            4) echo "::notice::Restored a baseline cache; lake build compiles the modules that changed since and the modules that import them." ;;
            3) echo "::warning::No cache record matches these build inputs or any baseline; lake build compiles every module." ;;
            *) exit "$status" ;;
          esac

      - name: lake build
        run: |
          set -o pipefail
          if [[ "$STAGE" == true ]]; then
            # As the hand publisher builds: -o writes Lake's map of every module's artifact, and
            # packs each module's .ltar under .lake/build/ir.
            export LAKE_CACHE_DIR="$PWD/.lake/cache" LAKE_RESTORE_ARTIFACTS=true
            lake build -o "$RUNNER_TEMP/outputs.jsonl" 2>&1 | tee build.log
          else
            lake build 2>&1 | tee build.log
          fi
          # Lake replays the saved messages of the modules it did not compile, so this covers
          # restored modules too.
          if grep -n -e 'declaration uses `sorry`' -e "declaration uses 'sorry'" build.log; then
            echo "::error::The build reports declarations that use sorry."
            exit 1
          fi

      - name: Check the axioms of the five theorems
        run: |
          set -o pipefail
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee axioms.log
          axioms='depends on axioms: [propext, Classical.choice, Quot.sound]'
          printf "'%s' $axioms\n" riemannHypothesis riemannZeta_eq_zero_re LFunction_ne_zero_of_half_lt_re \
            LFunction_eq_zero_re LFunction_eq_zero_re_of_isPrimitive > expected-axioms.log
          if ! diff -u expected-axioms.log axioms.log; then
            echo "::error::The five theorems must depend on exactly propext, Classical.choice and Quot.sound."
            exit 1
          fi

      - name: Verify the benchmark exercised the requested cache path
        env:
          EXPECT: ${{ matrix.mode }}
          HIT: ${{ steps.seed1.outputs.cache-hit }}
        run: |
          test "$(git rev-parse HEAD:src)" = 353028242054cc524485e472782ff1b062ae82ec
          if [[ "$EXPECT" == seeded ]]; then test "$HIT" = true; fi
      - name: Check that a bad proof still fails on a seed hit
        if: matrix.mode == 'seeded'
        run: |
          printf '\nexample : False := True.intro\n' >> src/Main.lean
          if lake build > "$RUNNER_TEMP/invalid-proof.log" 2>&1; then
            echo "::error::The invalid proof passed."
            exit 1
          fi
          grep -E 'error:.*Main.lean|Main.lean:.*error|Type mismatch' "$RUNNER_TEMP/invalid-proof.log"
