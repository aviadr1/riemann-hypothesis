name: Compare proof cache baselines
on:
  push:
    branches: [codex/bench-hosted-proof-routing]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        baseline: [moving-main, tested-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STAGE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: 91796aa4722f4d31c53d2c55aa361fc8cc68ade5
          persist-credentials: false
      - name: Prepare disposable hosted workspace
        run: |
          if (( $(df -BG --output=avail . | tail -1 | tr -dc '0-9') < 30 )); then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet
          fi
          df -h .
      - name: Fetch history for the selected baseline
        env:
          BASE: ${{ matrix.baseline == 'tested-base' && '3ad0b4b58709ee1275b7020c90ba97eb1eabd6e5' || 'c5451bd3ba92480e05c4218f5221bb2900c58706' }}
        run: git fetch --no-tags --depth=200 origin "$BASE:refs/bench/baseline"
      - name: Install elan and the toolchain in lean-toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version

      - name: Test the cache baseline selection
        run: python3 -I scripts/tests/test_ci_cache_baseline.py

      - name: Restore Mathlib's cache
        # As in scripts/lake-cache-get.sh, which `lake exe cache get` runs.
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe mathlib/cache get

      - name: Restore Tau Ceti's cache
        # As in scripts/lake-cache-get.sh: checks the Mathlib pins agree and that the statements
        # import no Tau Ceti module, then fetches the oleans of the imported Tau Ceti modules.
        run: python3 scripts/tauceti-cache-get.py

      - name: Restore this project's cache
        # Exit 0: the exact build inputs were restored, and nothing should compile.
        # Exit 4: a baseline was restored, and lake build compiles what changed since.
        # Exit 3: no record at all, and lake build compiles everything.
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          status=0
          python3 scripts/ci-cache-get.py --baseline refs/bench/baseline || status=$?
          case "$status" in
            0) echo "::notice::Restored the cache for these exact build inputs." ;;
            4) echo "::notice::Restored a baseline cache; lake build compiles the modules that changed since and the modules that import them." ;;
            3) echo "::warning::No cache record matches these build inputs or any baseline; lake build compiles every module." ;;
            *) exit "$status" ;;
          esac

      - name: lake build
        run: |
          set -o pipefail
          if [[ "$STAGE" == true ]]; then
            # As the hand publisher builds: -o writes Lake's map of every module's artifact, and
            # packs each module's .ltar under .lake/build/ir.
            export LAKE_CACHE_DIR="$PWD/.lake/cache" LAKE_RESTORE_ARTIFACTS=true
            lake build -o "$RUNNER_TEMP/outputs.jsonl" 2>&1 | tee build.log
          else
            timeout 14m lake build 2>&1 | tee build.log
          fi
          # Lake replays the saved messages of the modules it did not compile, so this covers
          # restored modules too.
          if grep -n -e 'declaration uses `sorry`' -e "declaration uses 'sorry'" build.log; then
            echo "::error::The build reports declarations that use sorry."
            exit 1
          fi

      - name: Check the axioms of the five theorems
        run: |
          set -o pipefail
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee axioms.log
          axioms='depends on axioms: [propext, Classical.choice, Quot.sound]'
          printf "'%s' $axioms\n" riemannHypothesis riemannZeta_eq_zero_re LFunction_ne_zero_of_half_lt_re \
            LFunction_eq_zero_re LFunction_eq_zero_re_of_isPrimitive > expected-axioms.log
          if ! diff -u expected-axioms.log axioms.log; then
            echo "::error::The five theorems must depend on exactly propext, Classical.choice and Quot.sound."
            exit 1
          fi
