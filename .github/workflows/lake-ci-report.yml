name: Lake CI-esta report probe
on:
  push:
    branches: [codex/lake-ci-report]
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  report:
    uses: gigaverse-app/ci-esta/.github/workflows/report.yml@f35e9fc3f536e12f934804cbd570b39ca5d54449
    with:
      run-id: 45882333783
      run-attempt: 1
      head-sha: a78dc8204a8bb382ec49fea4830e70118435c15c
      required-gates-json: '[{"kind":"actions_job","job_name":"Measure Lake setup and incremental builds"}]'
  run-link:
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context='Lake CI report / run link' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
